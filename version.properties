# SilentGram version — the NEXT build uses these values.
# The workflow reads them, builds with them, then bumps them and commits
# the new values back (using GITHUB_TOKEN, which does not trigger a new
# workflow run, so there is no build loop).
# versionCode must increase on every build (Play Store requirement);
# versionName bumps its patch number (2.0.1 -> 2.0.2 -> ...).
VERSION_CODE=8
VERSION_NAME=2.0.8
