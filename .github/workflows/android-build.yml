name: Build SilentGram (AAB + APK)

# Builds the release AAB and APK and attaches both to a GitHub Release.
# Runs on every push to master and on manual dispatch.
# NOTE: this build is signed with a debug keystore generated in the run,
# so the APK installs for testing. For Google Play, replace the signing
# step with a real release keystore (see the "release keystore" step).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Telegram needs its git submodules (ffmpeg, td, media, ...).
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caching: without it every run recompiles all of Telegram's native
      # C++ (ffmpeg, webrtc, tgcalls, td, ...) from scratch — ~1 hour.
      # With it, a small fix rebuilds in ~10-15 minutes.
      - name: Set up Gradle (cache dependencies + build outputs)
        uses: gradle/actions/setup-gradle@v3

      - name: Restore ccache (native C++ object cache)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # Unique key per commit so the updated cache is saved at the end
          # of the run; restore-keys falls back to the newest previous one.
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          ccache --max-size=4G
          ccache --set-config=compression=true
          ccache --zero-stats
          echo "ccache dir: $(ccache --get-config cache_dir)"

      - name: Install SDK 36 + NDK 27.2.12479018 (preinstalled SDK)
        run: |
          # ubuntu-latest already has the Android SDK preinstalled ($ANDROID_HOME).
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Accept licenses non-interactively, then install what Telegram needs.
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK + AAB
        # TMessagesProj is a LIBRARY — the app lives in TMessagesProj_App
        # (Play Store build, applicationId comes from APP_PACKAGE).
        run: ./gradlew :TMessagesProj_App:assembleRelease :TMessagesProj_App:bundleRelease --stacktrace

      - name: Show ccache stats (did the native cache hit?)
        run: ccache --show-stats || true

      - name: Sign APK + AAB (debug keystore, for testing)
        run: |
          # Generate a throwaway debug keystore so the APK is installable.
          keytool -genkeypair -v -keystore /tmp/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          # Telegram builds the "afat" flavor, so outputs live under
          # apk/afat/release and bundle/afatRelease (not apk/release).
          APK=$(find TMessagesProj_App/build/outputs/apk/afat/release -name "*.apk" | head -1)
          AAB=$(find TMessagesProj_App/build/outputs/bundle/afatRelease -name "*.aab" | head -1)
          echo "APK=$APK" >> $GITHUB_ENV
          echo "AAB=$AAB" >> $GITHUB_ENV
          echo "Found APK: $APK"
          echo "Found AAB: $AAB"
          # Sign the APK (zipalign + apksigner).
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" /tmp/SilentGram-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out /tmp/SilentGram-release.apk /tmp/SilentGram-aligned.apk
          "$BUILD_TOOLS/apksigner" verify /tmp/SilentGram-release.apk
          # Sign the AAB.
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/debug.keystore -storepass android -keypass android \
            "$AAB" androiddebugkey
          cp "$AAB" /tmp/SilentGram-release.aab
          ls -lh /tmp/SilentGram-release.apk /tmp/SilentGram-release.aab

      - name: Create Release (AAB + APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.2.2-silentgram-1
          name: SilentGram v13.2.2 (1)
          body: |
            SilentGram — first build with the new features:
            - Auto proxy in the background (parallel check, fastest wins)
            - First-login folders (Bots / Users / Groups / Channels)
            - Message menu: Forward Without Quoting, Schedule Download, Translate
            - Official @silent_gram channel (Sponsored suggestion + blue tick)
            - Developer page in Settings
            - Owner badge on @only_possible0
            - Final logo (gold/blue 3D S + paper plane, crescent + stars)
              and splash loader (plane flies in from the left into the S)

            Signed with a debug key (for testing). For Google Play, a release
            keystore is needed.
          files: |
            /tmp/SilentGram-release.apk
            /tmp/SilentGram-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
