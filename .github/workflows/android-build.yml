name: Build SilentGram (AAB + APK)

# Builds the release AAB and APK and attaches both to a GitHub Release.
# Runs on every push to master and on manual dispatch.
# NOTE: the build signs with the production keystore (silent_production)
# from GitHub Secrets — see the "Sign APK + AAB" step. If the secrets are
# not set yet, it falls back to a debug keystore (test build only).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Telegram needs its git submodules (ffmpeg, td, media, ...).
          submodules: recursive

      # SilentGram versioning: version.properties holds the NEXT version to
      # use. versionCode +1 and versionName patch +1 on every build, so each
      # build gets a unique tag (no more "release already exists" failures)
      # and Play Store always sees a higher versionCode.
      - name: Read next version
        id: version
        run: |
          CODE=$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)
          NAME=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "Building SilentGram v$NAME ($CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caching: without it every run recompiles all of Telegram's native
      # C++ (ffmpeg, webrtc, tgcalls, td, ...) from scratch — ~1 hour.
      # With it, a small fix rebuilds in ~10-15 minutes.
      - name: Set up Gradle (cache dependencies + build outputs)
        uses: gradle/actions/setup-gradle@v3

      - name: Restore ccache (native C++ object cache)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # Unique key per commit so the updated cache is saved at the end
          # of the run; restore-keys falls back to the newest previous one.
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          ccache --max-size=4G
          ccache --set-config=compression=true
          ccache --zero-stats
          echo "ccache dir: $(ccache --get-config cache_dir)"

      - name: Install SDK 36 + NDK 27.2.12479018 (preinstalled SDK)
        run: |
          # ubuntu-latest already has the Android SDK preinstalled ($ANDROID_HOME).
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Accept licenses non-interactively, then install what Telegram needs.
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK + AAB
        # TMessagesProj is a LIBRARY — the app lives in TMessagesProj_App
        # (Play Store build, applicationId comes from APP_PACKAGE).
        # -PAPP_VERSION_CODE/NAME override gradle.properties for this build.
        run: ./gradlew :TMessagesProj_App:assembleRelease :TMessagesProj_App:bundleRelease -PAPP_VERSION_CODE=${{ steps.version.outputs.code }} -PAPP_VERSION_NAME=${{ steps.version.outputs.name }} --stacktrace

      - name: Show ccache stats (did the native cache hit?)
        run: ccache --show-stats || true

      # NOTE: the release keystore is the SAME production keystore used by
      # our other apps (silent_production.keystore). It lives ONLY in GitHub
      # Secrets (this repo is public — the keystore + passwords must NEVER be
      # committed). Required secrets:
      #   SIGNING_KEYSTORE_BASE64 — base64 of silent_production.keystore
      #   SIGNING_STORE_PASSWORD, SIGNING_KEY_PASSWORD, SIGNING_KEY_ALIAS
      # If the secrets are not set yet, the build falls back to a throwaway
      # debug keystore so it still produces an installable APK for testing.
      - name: Sign APK + AAB (production keystore from Secrets)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            KS=/tmp/release.keystore
            KS_ALIAS="$SIGNING_KEY_ALIAS"
            KS_STORE_PASS="$SIGNING_STORE_PASSWORD"
            KS_KEY_PASS="$SIGNING_KEY_PASSWORD"
            echo "Signing with the production keystore."
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set — falling back to a debug keystore (test build only)."
            keytool -genkeypair -v -keystore /tmp/debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            KS=/tmp/debug.keystore
            KS_ALIAS=androiddebugkey
            KS_STORE_PASS=android
            KS_KEY_PASS=android
          fi
          # Telegram builds the "afat" flavor, so outputs live under
          # apk/afat/release and bundle/afatRelease (not apk/release).
          APK=$(find TMessagesProj_App/build/outputs/apk/afat/release -name "*.apk" | head -1)
          AAB=$(find TMessagesProj_App/build/outputs/bundle/afatRelease -name "*.aab" | head -1)
          echo "APK=$APK" >> $GITHUB_ENV
          echo "AAB=$AAB" >> $GITHUB_ENV
          echo "Found APK: $APK"
          echo "Found AAB: $AAB"
          # Sign the APK (zipalign + apksigner).
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" /tmp/SilentGram-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KS" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_STORE_PASS" --key-pass "pass:$KS_KEY_PASS" \
            --out /tmp/SilentGram-release.apk /tmp/SilentGram-aligned.apk
          "$BUILD_TOOLS/apksigner" verify /tmp/SilentGram-release.apk
          # Sign the AAB.
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$KS" -storepass "$KS_STORE_PASS" -keypass "$KS_KEY_PASS" \
            "$AAB" "$KS_ALIAS"
          cp "$AAB" /tmp/SilentGram-release.aab
          ls -lh /tmp/SilentGram-release.apk /tmp/SilentGram-release.aab

      # Safety net: even if the Release step below fails, the APK + AAB are
      # always kept as workflow artifacts, so a good build is never lost.
      - name: Upload APK + AAB as artifacts (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SilentGram-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            /tmp/SilentGram-release.apk
            /tmp/SilentGram-release.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release (AAB + APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: SilentGram v${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          body: |
            SilentGram v${{ steps.version.outputs.name }} (version code ${{ steps.version.outputs.code }})
            - Auto proxy in the background (parallel check, fastest wins)
            - First-login folders (Bots / Users / Groups / Channels)
            - Message menu: Forward Without Quoting, Schedule Download, Translate
            - Official @silent_gram channel (Official row + blue tick)
            - Developer page in Settings
            - Owner badge on @only_possible0
            - Final logo (gold/blue 3D S + paper plane, crescent + stars)
              and splash loader (plane flies in from the left into the S)

            Signed with a debug key (for testing). For Google Play, a release
            keystore is needed.
          files: |
            /tmp/SilentGram-release.apk
            /tmp/SilentGram-release.aab
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bump the version for the NEXT build and commit it back. Pushing with
      # GITHUB_TOKEN does not trigger a new workflow run, so no build loop.
      - name: Bump version for next build
        if: success()
        run: |
          CODE=${{ steps.version.outputs.code }}
          NAME=${{ steps.version.outputs.name }}
          NEXT_CODE=$((CODE + 1))
          NEXT_NAME=$(echo "$NAME" | awk -F. '{print $1"."$2"."$3+1}')
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=$NEXT_CODE/" version.properties
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$NEXT_NAME/" version.properties
          cat version.properties
          git config user.name "SilentGram Builder"
          git config user.email "builder@silentgram.local"
          git add version.properties
          git diff --cached --quiet || git commit -m "Bump version to v$NEXT_NAME ($NEXT_CODE) [skip ci]"
          git push origin HEAD:master
